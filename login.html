<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="login.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login page</title>
</head>
<body>
    <header>
        <div class="header_1">
            <div class="icon_img"><img src="Images/plus.png" alt=""></div>
            <h5>CArePlus Hospital</h5>
        </div>
        <div class="header_2">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About Us</a></li>
                <li><a href="">Service</a></li>
                <li><a href="">Doctors</a></li>
                <li><a href="">Contact</a></li>
            </ul>
            <button>Book Appointment</button>
        </div>
    </header>


    <main>
        <div class="container_1">
            <img src="Images/logImage.jpg" alt="">
        </div>
        <div class="container_2">
            <form action="" method="POST">
              
                <h2>Welcome Back!</h2>
                <p>Sign In to your Account</p>
                <div>
                    <label for="User">Username</label>
                    <input type="text" id="User" name="username" outocomplete="off">
                    <p class="btn_link"><a href="">Forget password?</a></p>
                </div>

                <div>
                    <label for="Password">Password</label>
                    <input type="password" id="Password" name="password">
                </div>

                <button>Login</button>
                <p class="btn_link">Dont have an Account?<a href="">Sign Up</a></p>
            </form>
        </div>
    </main>
</body>
</html>
