<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="sett.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>setting page</title>
</head>
<body>
    <main>
        <div class="nav_bar">
            <div class="nav_cont">
                <div>
                    <img src="Images/plus.png" alt="">
                </div>
                <div>
                    <h5 class="head_nav">CArePlus Hospital</h5>
                    <p class="head_nav">Admin Panel</p>
                </div>
            </div>
            <div class="nav_cont">
                <div><img src="Images/home2.png" alt=""></div>
                <p><a href="">Dashboard</a></p>
            </div>

            <div class="nav_cont">
                <div><img src="Images/appointment.png" alt=""></div>
                <p><a href="">Appointment</a></p>
            </div>

            <div class="nav_cont">
                <div><img src="Images/service.png" alt=""></div>
                <p><a href="">Services</a></p>
            </div>

            <div class="nav_cont">
                <div><img src="Images/logout.png" alt=""></div>
                <p><a href="">Sign Out</a></p>
            </div>
            
        </div>

        <div class="changes">
            <h5>Settings</h5>
            <div class="switch_link">
                <p id="first"><a href="">General</a></p>
                <p><a href="">Notifications</a></p>
                <p><a href="">Security</a></p>
                <p><a href="">Backup</a></p>
            </div>
            <form action="">
                <h5>General Setting</h5>
                <div>
                    <label for="hosp">Hospital Name</label>
                    <input type="text" id="hosp" name="hospital_name">
                </div>
                
                <div>
                    <label for="Email">Email Address</label>
                    <input type="email" id="Email" name="email" autocomplete="off">
                </div>

                <div>
                    <label for="Phone">Phone Number</label>
                    <input type="tel" id="Phone" name="phone" autocomplete="off">
                </div>

                <div>
                    <label for="Addr">Address</label>
                    <input type="text" id="Addr" name="hospital_address">
                </div>

                <button>Save Changes</button>
            </form>
        </div>
    </main>
</body>
</html>
